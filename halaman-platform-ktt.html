function ed(k,i,j,v){S[k].r[i][j]=(/^-?\d+(\.\d+)?$/.test(v)&&!/Nomor|ID|Tinjau/.test(S[k].c[j]))?+v:v;save();rend()}
const D={rkab:'Parameter RKAB tahun berjalan; dipakai di Dasbor KTT.',insiden:'Setiap baris otomatis masuk Statistik KPI HSE, Dasbor, dan Laporan triwulan.',sop:'Status disahkan memengaruhi indikator proaktif.',inspeksi:'Capaian inspeksi masuk indikator proaktif.',temuan:'Ketepatan waktu tindak lanjut masuk indikator proaktif.',agenda:'Pelaksanaan agenda masuk indikator proaktif.',inventaris:'Daftar APD, APAR, dan peralatan K3.',izin:'Kelengkapan dokumen izin masuk Dasbor KTT; baris ke-6 = jaminan reklamasi.',kontraktor:'Daftar kontraktor dan skor CSMS.',personel:'Sertifikat kompetensi berlaku masuk indikator proaktif.',surat:'Surat penunjukan Pjs. KTT dan korespondensi.',jam:'Jam kerja per triwulan untuk LTIFR, FR, SR; produksi dan biaya untuk laporan triwulan.'};
Object.keys(D).forEach(k=>PG[k]=()=>`<h1>${TTL[k]}</h1><p class="sub">${D[k]}</p>${k=='insiden'?`<div class="g g4">${F('Insiden',[M().ins,'Tahun 2026'])}${F('Cedera',[M().ced,'LTI dan P3K'])}${F('Nyaris celaka',[M().nyaris,'Dilaporkan'])}${F('Hari hilang',[M().hh,'Akumulasi'])}</div><br>`:''}<div class="c">${tbl(k)}</div>${k=='insiden'?'<p><a class="lk" onclick="go(\'kpi\')">Lihat Statistik KPI HSE →</a></p>':''}`);
PG.setelan=()=>`<h1>Setelan</h1><p class="sub">Parameter dasar dan impor data dari template Excel.</p><div class="g g2"><div class="c"><h3>Identitas</h3><label>Nama perusahaan (PT)</label><input style="width:100%" placeholder="mis. PT ..." value="${S.set.pt}" onchange="S.set.pt=this.value;save();hdr()"><label>Nama KTT / Pjs. KTT</label><input style="width:100%" placeholder="Nama lengkap" value="${S.set.pjs}" onchange="S.set.pjs=this.value;save();hdr()"><label>Tanggal LTI terakhir</label><input type="date" value="${S.set.lti}" onchange="S.set.lti=this.value;save()"><label>Mulai jabatan KTT/Pjs.</label><input type="date" value="${S.set.pjsMulai}" onchange="S.set.pjsMulai=this.value;save()"></div>
<div class="c"><h3>Impor template Excel</h3><p class="m">Unggah <b>Template_Platform_KTT.xlsx</b> yang sudah diisi. Semua sheet dibaca dan menggantikan data di menu terkait.</p><input type="file" accept=".xlsx" onchange="imp(this.files[0])"><p><button class="btn o" onclick="exp()">Ekspor data ke Excel</button> <button class="btn o" onclick="reset(1)">Kosongkan semua data</button></p></div></div>`;
PG.panduan=()=>`<h1>Panduan dan Tutorial</h1><p class="sub">Alur kerja singkat.</p><div class="c"><ol><li>Isi <a class="lk" onclick="go('jam')">jam kerja</a> dan <a class="lk" onclick="go('insiden')">insiden</a> → KPI HSE terhitung otomatis.</li><li>Lengkapi <a class="lk" onclick="go('risiko')">IBPR/HIRA</a>, <a class="lk" onclick="go('temuan')">temuan</a>, <a class="lk" onclick="go('inspeksi')">inspeksi</a>, <a class="lk" onclick="go('sop')">SOP</a> → indikator proaktif dan Indeks kesiapan.</li><li>Isi <a class="lk" onclick="go('izin')">perizinan</a>, <a class="lk" onclick="go('rekl')">reklamasi</a>, <a class="lk" onclick="go('rkab')">RKAB</a>.</li><li>Buka <a class="lk" onclick="go('laporan')">Laporan dan RKAB</a>, tandai disampaikan, lalu cetak PDF (Unduh PDF memakai Print → Simpan sebagai PDF).</li><li>Atau isi Template Excel lalu impor di <a class="lk" onclick="go('setelan')">Setelan</a>. Data tersimpan di browser ini (localStorage).</li></ol></div>`;
const SH={'Insiden':'insiden','Risiko':'risiko','Inspeksi':'inspeksi','Temuan':'temuan','Agenda':'agenda','SOP':'sop','Inventaris':'inventaris','Personel':'personel','Perizinan':'izin','Kontraktor':'kontraktor','Surat':'surat','Reklamasi':'rekl','RKAB':'rkab','JamKerja':'jam'};
function imp(f){if(!f)return;const r=new FileReader();r.onload=e=>{const w=XLSX.read(e.target.result,{type:'array'});if(w.Sheets.Pengaturan){XLSX.utils.sheet_to_json(w.Sheets.Pengaturan,{header:1,defval:''}).forEach(x=>{const m={'Nama perusahaan':'pt','Nama KTT / Pjs. KTT':'pjs','Tanggal LTI terakhir':'lti','Mulai jabatan KTT':'pjsMulai'}[x[0]];if(m&&x[1]!=='')S.set[m]=String(x[1])})}Object.entries(SH).forEach(([s,k])=>{if(!w.Sheets[s])return;const a=XLSX.utils.sheet_to_json(w.Sheets[s],{header:1,defval:''}).slice(1).filter(x=>x.some(v=>v!==''));S[k].r=a.map(x=>S[k].c.map((_,j)=>x[j]??''))});save();alert('Impor selesai.');go('dasbor')};r.readAsArrayBuffer(f)}
function exp(){const w=XLSX.utils.book_new();Object.entries(SH).forEach(([s,k])=>XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([S[k].c,...S[k].r]),s));XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Nama perusahaan',S.set.pt],['Nama KTT / Pjs. KTT',S.set.pjs],['Tanggal LTI terakhir',S.set.lti],['Mulai jabatan KTT',S.set.pjsMulai]]),'Pengaturan');XLSX.writeFile(w,'Data_Platform_KTT.xlsx')}
function reset(all){if(all){Object.keys(SH).filter(s=>!['rkab','izin','jam'].includes(SH[s])).forEach(s=>S[SH[s]].r=[])}else Object.keys(SH).forEach(s=>{if(['insiden','risiko','temuan','sop','inventaris','surat','rekl'].includes(SH[s]))S[SH[s]].r=[]});save();rend()}
function hdr(){$('#hP').textContent=S.set.pjs||'belum diisi';$('#hS').textContent=(S.set.pt||'Nama perusahaan belum diisi')+' · IUP Operasi Produksi';document.title='Platform KTT'+(S.set.pt?' — '+S.set.pt:'')}
function rend(){const p=(location.hash||'#dasbor').slice(1);const pg=PG[p]?p:'dasbor';nav(pg);$('#main').innerHTML=PG[pg]();hdr()}
addEventListener("hashchange",()=>{rend();scrollTo(0,0)});
$('#q').addEventListener('keydown',e=>{if(e.key=='Enter'){const v=e.target.value.toLowerCase(),k=Object.keys(TTL).find(k=>TTL[k].toLowerCase().includes(v));if(k)go(k)}});
addEventListener('keydown',e=>{if(e.ctrlKey&&e.key=='k'){e.preventDefault();$('#q').focus()}});
rend();
</script></body></html>
